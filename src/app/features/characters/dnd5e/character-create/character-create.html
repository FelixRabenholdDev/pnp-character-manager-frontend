<h2>Neuen Charakter erstellen</h2>

@if (errorMessage()) {
  <p style="color: red;">{{ errorMessage() }}</p>
}

<form [formGroup]="characterForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Klasse</mat-label>
    <input matInput formControlName="characterClass">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Rasse</mat-label>
    <input matInput formControlName="race">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Level</mat-label>
    <input matInput type="number" formControlName="level">
  </mat-form-field>

  <h3>Attribute</h3>

  <div formGroupName="stats" class="stats-grid">
    <mat-form-field appearance="outline">
      <mat-label>Stärke</mat-label>
      <input matInput type="number" formControlName="strength">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Geschicklichkeit</mat-label>
      <input matInput type="number" formControlName="dexterity">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Konstitution</mat-label>
      <input matInput type="number" formControlName="constitution">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Intelligenz</mat-label>
      <input matInput type="number" formControlName="intelligence">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Weisheit</mat-label>
      <input matInput type="number" formControlName="wisdom">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Charisma</mat-label>
      <input matInput type="number" formControlName="charisma">
    </mat-form-field>
  </div>

  <button mat-raised-button color="primary" type="submit" [disabled]="characterForm.invalid">
    Charakter erstellen
  </button>
</form>
